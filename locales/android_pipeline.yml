android_pipeline.watcher_error:
  en: "File watcher error: %{error}"
  pt-BR: "Erro no monitor de arquivos: %{error}"
android_pipeline.change_detected:
  en: "Change detected in: %{paths}"
  pt-BR: "Alteração detectada em: %{paths}"
android_pipeline.app_updated:
  en: "App updated in %{secs}s.\n"
  pt-BR: "App atualizado em %{secs}s.\n"
