[package]
name = "jirau"
version = "0.4.0"
edition = "2024"
authors = ["Lucas Eufrasio <lucaswilliameufrasio@users.noreply.github.com>"]
description = "Native cross-platform scaffold CLI (Rust core + Android Jetpack Compose + iOS SwiftUI) via UniFFI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lucaswilliameufrasio/jirau"

[dependencies]
clap = { version = "4.6", features = ["derive", "cargo", "string"] }
inquire = "0.9"
colored = "3.1"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
anyhow = "1"
which = "8"
walkdir = "2.5"
notify = "8.2"
tempfile = "3.27"
rust-i18n = "4.2"
sys-locale = "0.3"

[dev-dependencies]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
