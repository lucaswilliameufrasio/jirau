[package]
name = "jirau"
version = "0.1.0"
edition = "2021"
authors = ["Lucas Eufrasio <lucaswilliameufrasio@users.noreply.github.com>"]
description = "CLI de scaffold nativo multiplataforma (Rust + Android Jetpack Compose + iOS SwiftUI) via UniFFI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lucaswilliameufrasio/jirau"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
inquire = "0.7"
colored = "2.1"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
which = "6.0"
walkdir = "2.5"
notify = "6.1"

[dev-dependencies]
tempfile = "3.10"
