edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1.29", features = ["v4", "fast-rng"] }
thiserror = "2"
aws-lc-rs = "1.19"
