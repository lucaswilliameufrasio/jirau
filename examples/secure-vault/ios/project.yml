name: SecureVault
options:
  bundleIdPrefix: io.github.jirau.vault
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: io.github.jirau.vault
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SecureVault:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Generated
        optional: true
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ENABLE_PREVIEWS: YES
    frameworks:
      - framework: Frameworks/secure_vault_ffi.xcframework
        optional: true
