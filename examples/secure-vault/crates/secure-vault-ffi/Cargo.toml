[package]
name = "secure-vault-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "secure_vault_ffi"

[dependencies]
secure-vault-core = { path = "../secure-vault-core" }
uniffi = { version = "0.28", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
