name: AllPlatformsShowcase
options:
  bundleIdPrefix: com.example.showcase
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.showcase
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AllPlatformsShowcase:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Generated
        optional: true
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ENABLE_PREVIEWS: YES
    frameworks:
      - framework: Frameworks/all_platforms_showcase_ffi.xcframework
        optional: true
