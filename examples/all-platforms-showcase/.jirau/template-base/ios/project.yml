name: AllPlatformsShowcase
options:
  bundleIdPrefix: com.example.showcase
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.showcase
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Simulador: assinatura ad-hoc ("Sign to Run Locally"), sem time de
    # desenvolvimento. Sem assinatura o app não tem entitlements e o Keychain
    # falha com errSecMissingEntitlement (-34018).
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

targets:
  AllPlatformsShowcase:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # Bindings Swift gerados pelo UniFFI (scripts/build-ios-ffi.sh)
      - path: Generated
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ENABLE_PREVIEWS: YES
    dependencies:
      # Núcleo Rust estático (scripts/build-ios-ffi.sh). Biblioteca estática: não embutir.
      - framework: Frameworks/all_platforms_showcase_ffi.xcframework
        embed: false
    scheme:
      testTargets:
        - AllPlatformsShowcaseTests

  AllPlatformsShowcaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.showcase.tests
    dependencies:
      - target: AllPlatformsShowcase
